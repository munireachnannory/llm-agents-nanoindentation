# Model Configuration for Nanoindentation Agent

models:
  default_max_tokens: 2048
  default_temperature: 0.7
  
  roles:
    hypothesis:
      model: "Qwen/Qwen2.5-72B-Instruct"
      temperature: 0.7
      max_tokens: 2048
      provider: huggingface
      
    supervisor:
      model: "Qwen/Qwen2.5-72B-Instruct"
      temperature: 0.5
      max_tokens: 1024
      provider: huggingface
      
    instrument:
      model: "Qwen/Qwen2.5-72B-Instruct"
      temperature: 0.3
      max_tokens: 1024
      provider: huggingface
      
    measurement_critic:
      model: "Qwen/Qwen2.5-72B-Instruct"
      temperature: 0.5
      max_tokens: 2048
      provider: huggingface
      
    hypothesis_critic:
      model: "Qwen/Qwen2.5-72B-Instruct"
      temperature: 0.5
      max_tokens: 1024
      provider: huggingface
      
    literature:
      model: "Qwen/Qwen2.5-72B-Instruct"
      temperature: 0.3
      max_tokens: 2048
      provider: huggingface
      
    image_analysis:
      # Qwen2.5-VL is the only VL model passing the HF probe (see notebook section 2)
      model: "Qwen/Qwen2.5-VL-72B-Instruct"
      temperature: 0.3
      max_tokens: 2048
      vision: true
      provider: huggingface

    orchestrator:
      # main objective-driven orchestrator (notebook 5): objective compilation,
      # per-agent briefings, decision advisory
      model: "Qwen/Qwen2.5-72B-Instruct"
      temperature: 0.2
      max_tokens: 1536
      provider: huggingface

    measurement_strategy:
      # bounded per-site recipe advisor; deterministic validators remain authoritative
      model: "Qwen/Qwen2.5-72B-Instruct"
      temperature: 0.1
      max_tokens: 1536
      provider: huggingface
